<!DOCTYPE html>
<html lang="en-AU" class="h-full">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="csrf-token" content="{{ csrf_token() }}">
    <title>{% block title %}FeedMe{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
    <script>
      // Pre-paint only: set the theme class before first paint so the page
      // never flashes the wrong palette. All behaviour lives in theme.js.
      (function () {
        try {
          var stored = localStorage.getItem('feedme:theme');
          var dark = stored
            ? stored === 'dark'
            : window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (dark) document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
    <script type="module" src="{{ url_for('static', filename='js/theme.js') }}"></script>
    {% block head_scripts %}{% endblock %}
  </head>
  <body class="min-h-full bg-surface text-ink antialiased">
    <a class="skip-link" href="#main">Skip to content</a>

    <header class="site-header">
      <div class="site-header__inner">
        <a class="site-header__brand" href="{{ url_for('public.index') }}">FeedMe</a>
        <nav class="site-nav" aria-label="Catalogue">
          <a class="site-nav__link" href="{{ url_for('public.components') }}">Components</a>
        </nav>
        <button
          type="button"
          class="btn btn--ghost"
          data-theme-toggle
          hidden
          aria-pressed="false"
        >Dark mode</button>
      </div>
    </header>

    <main id="main" class="page">
      {% block content %}{% endblock %}
    </main>

    <footer class="site-footer">
      <p>Prepared meals. Allergen information is provided for every item.</p>
    </footer>
  </body>
</html>
